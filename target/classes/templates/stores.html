<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stores</title><link rel="stylesheet" href="/css/bookportal.css"></head><body><div th:replace="~{fragments :: nav('stores')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>
<h1 class="title">Stores</h1><form class="row" method="get"><input class="input" name="city" th:value="${city}" placeholder="Filter by city"><button class="btn">Search</button></form><br><div class="grid grid-3"><div class="card" th:each="s:${stores}"><h3 th:text="${s.storeName}"></h3><p class="muted"><span th:text="${s.city}"></span>, <span th:text="${s.state}"></span></p><p>Rating: <span th:text="${s.rating}"></span></p><a class="btn secondary" th:href="@{'/stores/'+${s.storeId}+'/books'}">View Store Books</a></div></div>
</main></body></html>
