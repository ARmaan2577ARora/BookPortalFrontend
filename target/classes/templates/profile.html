<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile</title><link rel="stylesheet" href="/css/bookportal.css"></head><body><div th:replace="~{fragments :: nav('profile')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>
<h1 class="title">Profile</h1><div class="grid grid-2"><div class="card"><h2>User Details</h2><p><b>Name:</b> <span th:text="${customer.fullName}"></span></p><p><b>Email:</b> <span th:text="${customer.email}"></span></p><p><b>Phone:</b> <span th:text="${customer.phone}"></span></p><p><b>Role:</b> <span th:text="${customer.roleName}"></span></p></div><div class="card"><h2>Add Address</h2><form method="post" action="/checkout/address"><input class="input" name="houseAddress" placeholder="House address" required><br><br><input class="input" name="city" placeholder="City" required><br><br><input class="input" name="state" placeholder="State"><br><br><input class="input" name="zipcode" placeholder="Zipcode"><br><br><button class="btn">Save Address</button></form></div></div><h2>Saved Addresses</h2><div class="grid grid-3"><div class="card" th:each="a:${addresses}"><b th:text="${a.houseAddress}"></b><p class="muted"><span th:text="${a.city}"></span>, <span th:text="${a.state}"></span></p></div></div>
</main></body></html>
