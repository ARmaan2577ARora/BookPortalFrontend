<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Store Books</title><link rel="stylesheet" href="/css/bookportal.css"></head><body><div th:replace="~{fragments :: nav('stores')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>
<h1 class="title" th:text="${store.storeName}">Store</h1><p class="sub"><span th:text="${store.city}"></span>, <span th:text="${store.state}"></span></p><table class="table card"><thead><tr><th>Book</th><th>Price</th><th>Stock</th><th>Delivery</th><th></th></tr></thead><tbody><tr th:each="sb:${storeBooks}"><td><a th:href="@{'/books/'+${sb.book.bookId}}" th:text="${sb.book.title}"></a></td><td>₹<span th:text="${sb.price}"></span></td><td th:text="${sb.stockQuantity}"></td><td><span th:text="${sb.deliveryDays}"></span> days</td><td><form method="post" action="/cart/add"><input type="hidden" name="storeBookId" th:value="${sb.storeBookId}"><input type="hidden" name="redirectTo" th:value="@{'/stores/'+${store.storeId}+'/books'}"><button class="btn">Add</button></form></td></tr></tbody></table>
</main></body></html>
