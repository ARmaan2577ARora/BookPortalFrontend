<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order Confirmed</title><link rel="stylesheet" href="/css/bookportal.css"></head><body><div th:replace="~{fragments :: nav('orders')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>

</main></body></html>
