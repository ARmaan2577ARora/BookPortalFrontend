<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Compare Prices</title><link rel="stylesheet" href="/css/bookportal.css"></head><body><div th:replace="~{fragments :: nav('stores')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>
    <h1 class="title">Compare Prices</h1><p class="sub">Book: <b th:text="${book.title}"></b></p><form class="row" method="get"><input class="input" name="city" th:value="${city}" placeholder="Filter by city"><button class="btn">Search</button></form><br>
    <table class="table card"><thead><tr><th>Store</th><th>City</th><th>Stock</th><th>Delivery</th><th>Price</th><th>Action</th></tr></thead><tbody><tr th:each="sb,stat:${storeBooks}"><td><b th:text="${sb.store.storeName}"></b> <span class="pill" th:if="${stat.index==0}">Best Price</span></td><td th:text="${sb.store.city}"></td><td th:text="${sb.stockQuantity}"></td><td><span th:text="${sb.deliveryDays}"></span> days</td><td class="price">₹<span th:text="${sb.price}"></span></td><td><form method="post" action="/cart/add"><input type="hidden" name="storeBookId" th:value="${sb.storeBookId}"><input type="hidden" name="redirectTo" th:value="@{'/books/'+${book.bookId}+'/stores'}"><button class="btn">Add</button></form></td></tr></tbody></table>
</main></body></html>
