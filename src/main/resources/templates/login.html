<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/bookportal.css">
</head>
<body>
<div th:replace="~{fragments :: nav('login')}"></div>
<main class="container">
    <div th:replace="~{fragments :: messages}"></div>

    <div class="card" style="max-width:440px;margin:auto">
        <h1>Login</h1>

        <form method="post" action="/login">
            <label>Email</label>
            <input class="input" name="email" type="email" required>
            <br><br>
            <label>Password</label>
            <input class="input" name="password" type="password" required>
            <br><br>
            <button class="btn" style="width:100%">Login</button>
        </form>

        <div class="muted" style="text-align:center;margin:18px 0 14px">or login with GitHub</div>

        <a class="btn secondary" style="width:100%;text-align:center;justify-content:center" th:href="${backendBaseUrl + '/oauth2/authorization/github'}">
            Login with GitHub
        </a>

        <p class="muted">No account? <a href="/signup">Signup</a></p>
    </div>
</main>
</body>
</html>
