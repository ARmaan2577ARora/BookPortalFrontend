<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cart</title><link rel="stylesheet" href="/css/bookportal.css"></head><body><div th:replace="~{fragments :: nav('cart')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>
<h1 class="title">My Cart</h1><div th:if="${#lists.isEmpty(cartLines)}" class="card"><p>Your cart is empty.</p><a class="btn" href="/books">Browse Books</a></div>
<div th:if="${!#lists.isEmpty(cartLines)}"><table class="table card"><thead><tr><th>Book</th><th>Store</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead><tbody><tr th:each="line:${cartLines}"><td th:text="${line.storeBook.book.title}"></td><td th:text="${line.storeBook.store.storeName}"></td><td>₹<span th:text="${line.storeBook.price}"></span></td><td><form class="row" method="post" action="/cart/update"><input type="hidden" name="storeBookId" th:value="${line.storeBookId}"><input class="input" style="width:80px" type="number" min="0" name="quantity" th:value="${line.quantity}"><button class="btn secondary">Update</button></form></td><td>₹<span th:text="${line.subtotal}"></span></td><td><form method="post" action="/cart/remove"><input type="hidden" name="storeBookId" th:value="${line.storeBookId}"><button class="btn danger">Remove</button></form></td></tr></tbody></table><div class="space card"><h2>Total: ₹<span th:text="${cartTotal}"></span></h2><a class="btn" href="/checkout">Proceed to Checkout</a></div></div>
</main></body></html>
