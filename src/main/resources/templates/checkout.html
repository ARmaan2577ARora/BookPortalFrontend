<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout</title><link rel="stylesheet" href="/css/bookportal.css"><link rel="stylesheet" href="/css/checkout.css"><script src="/js/checkout.js"></script></head><body><div th:replace="~{fragments :: nav('checkout')}"></div><main class="container"><div th:replace="~{fragments :: messages}"></div>
<h1 class="title">Checkout</h1><div class="checkout-layout"><div>
<div class="card"><h2>Customer Details</h2><p><b>Name:</b> <span th:text="${customer.fullName}"></span></p><p><b>Email:</b> <span th:text="${customer.email}"></span></p><p><b>Phone:</b> <span th:text="${customer.phone}"></span></p></div>
<div class="card"><div class="space"><h2>Delivery Address</h2><button class="btn secondary" type="button" onclick="toggleAddressForm()">+ Add Address</button></div>
<div id="addressForm" class="address-form" style="display:none"><form method="post" action="/checkout/address"><label>House Address</label><input class="input" name="houseAddress" required><div class="row"><div style="flex:1"><label>City</label><input class="input" name="city" required></div><div style="flex:1"><label>State</label><input class="input" name="state"></div></div><div class="row"><div style="flex:1"><label>Zipcode</label><input class="input" name="zipcode"></div><div style="flex:1"><label>Country</label><input class="input" name="country" value="India"></div></div><label><input type="checkbox" name="makeDefault" value="true"> Make default</label><br><br><button class="btn">Save Address</button></form></div>
<form method="post" action="/checkout/place-order"><div th:if="${#lists.isEmpty(addresses)}" class="error">No address found. Add one above before placing order.</div><div class="card" th:each="a:${addresses}" style="box-shadow:none"><label><input type="radio" name="addressId" th:value="${a.addressId}" required> <b th:text="${a.houseAddress}"></b>, <span th:text="${a.city}"></span>, <span th:text="${a.state}"></span>, <span th:text="${a.zipcode}"></span></label></div><h3>Payment</h3><select name="paymentMethod"><option value="COD">Cash on Delivery</option><option value="UPI">UPI</option><option value="CARD">Card</option></select><br><br><button class="btn" th:disabled="${#lists.isEmpty(addresses)}">Place Order</button></form></div></div>
<div class="card summary-box"><h2>Order Summary</h2><div th:each="line:${cartLines}" class="space"><span th:text="${line.storeBook.book.title}"></span><span>₹<span th:text="${line.subtotal}"></span></span></div><hr><div class="space"><b>Total</b><b>₹<span th:text="${cartTotal}"></span></b></div></div></div>
</main></body></html>
